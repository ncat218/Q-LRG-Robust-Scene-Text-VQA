[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qlrg-textvqa"
version = "0.1.0"
requires-python = ">=3.10"
description = "D0 and S0 diagnostics for Qwen2.5-VL on clean and LR4 TextVQA"

[project.scripts]
qlrg = "qlrg.cli:main"

[tool.setuptools.packages.find]
include = ["qlrg*"]
